<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; base-uri 'self'; object-src 'none'; form-action 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>페이지를 찾을 수 없습니다 | 씨유소프트</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1e53a3" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root { --blue:#1e53a3; --green:#23a839; --ink:#0f172a; --muted:#64748b; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: "Noto Sans KR", -apple-system, "Malgun Gothic", sans-serif;
      color: var(--ink); text-align: center;
      background:
        radial-gradient(60% 60% at 80% 0%, rgba(35,168,57,.12), transparent 60%),
        radial-gradient(70% 70% at 10% 10%, rgba(30,83,163,.14), transparent 55%),
        linear-gradient(180deg, #f3f8ff, #fff);
    }
    .wrap { max-width: 520px; }
    .code {
      font-size: clamp(4rem, 16vw, 8rem); font-weight: 900; line-height: 1; letter-spacing: -.04em;
      background: linear-gradient(120deg, var(--blue), var(--green));
      -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px;
    }
    h1 { font-size: clamp(1.2rem, 4vw, 1.6rem); margin: 0 0 12px; }
    p { color: var(--muted); margin: 0 0 28px; line-height: 1.7; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 999px;
      font-weight: 700; color: #fff; text-decoration: none;
      background: linear-gradient(120deg, var(--blue), var(--green));
      box-shadow: 0 8px 20px rgba(30,83,163,.25);
    }
    .pixels { display: flex; gap: 6px; justify-content: center; margin-bottom: 28px; }
    .pixels span { width: 12px; height: 12px; border-radius: 2px; }
    .pixels span:nth-child(odd) { background: var(--green); }
    .pixels span:nth-child(even) { background: var(--blue); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="pixels"><span></span><span></span><span></span><span></span></div>
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>요청하신 페이지가 이동되었거나 존재하지 않습니다.<br />주소를 확인하시거나 홈으로 돌아가 주세요.</p>
    <a class="btn" href="/">홈으로 돌아가기</a>
  </div>
</body>
</html>
